<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">压印之间 Print Atlas — 版画与报刊印刷图鉴</title>
  <desc id="desc">暖纸底编辑风标题：压印之间，副标题图像不是被复制的，而是被压印的；右侧白卡上是 CMYK 四色圆点叠印成的玫瑰花结与一行由小变大的半调网点。</desc>

  <rect width="1200" height="360" rx="26" fill="#f4eee1"/>

  <g id="deco" opacity="0.55">
    <circle cx="700" cy="52" r="10" fill="#d8cdb4"/>
    <circle cx="730" cy="52" r="7" fill="#d8cdb4"/>
    <circle cx="754" cy="52" r="4" fill="#d8cdb4"/>
    <circle cx="60" cy="322" r="8" fill="#d8cdb4"/>
    <circle cx="86" cy="322" r="5" fill="#d8cdb4"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6b4a2f">版画与报刊印刷图鉴 · PRINT ATLAS</text>
    <text x="56" y="130" font-size="60" font-weight="700" fill="#1c1a17">压印之间</text>
    <text x="56" y="170" font-size="23" fill="#a63a24">PRINT ATLAS — 图像不是被复制的，而是被压印的</text>
    <text x="56" y="206" font-size="19" fill="#4a4238">七种印刷语言 × 三组题材，四种转印关系一次看完整。</text>
    <g id="chips" font-size="18" fill="#f4eee1" text-anchor="middle">
      <g><rect x="56" y="238" width="112" height="36" rx="18" fill="#1c1a17"/><text x="112" y="262">7 种语言</text></g>
      <g><rect x="180" y="238" width="122" height="36" rx="18" fill="#1c1a17"/><text x="241" y="262">21 幅图例</text></g>
      <g><rect x="314" y="238" width="112" height="36" rx="18" fill="#1c1a17"/><text x="370" y="262">4 种转印</text></g>
      <g><rect x="438" y="238" width="132" height="36" rx="18" fill="#1c1a17"/><text x="504" y="262">中英提示词</text></g>
    </g>
  </g>

  <g id="rosette-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="800" y="44" width="344" height="272" rx="16" fill="#ffffff" stroke="#d8cdb4" stroke-width="1.5"/>
    <text x="828" y="80" font-size="18" fill="#4a4238">CMYK · 四色网点叠印</text>
    <g id="venn" opacity="0.62">
      <circle cx="930" cy="142" r="48" fill="#00a0dc"/>
      <circle cx="1014" cy="142" r="48" fill="#e5007d"/>
      <circle cx="972" cy="196" r="48" fill="#f2c200"/>
    </g>
    <circle cx="972" cy="158" r="16" fill="none" stroke="#1c1a17" stroke-width="2"/>
    <g id="halftone-row" fill="#1c1a17">
      <circle cx="848" cy="268" r="3"/>
      <circle cx="884" cy="268" r="5"/>
      <circle cx="926" cy="268" r="7"/>
      <circle cx="974" cy="268" r="9"/>
      <circle cx="1028" cy="268" r="11"/>
      <circle cx="1088" cy="268" r="13"/>
    </g>
    <text x="828" y="306" font-size="18" fill="#4a4238">点越大，灰阶越深</text>
  </g>
</svg>
